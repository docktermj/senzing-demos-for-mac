# Target: local / on-premises — single service with a SQLite volume (development and testing only;
# SQLite does not support concurrent writes). Switch to a PostgreSQL service before production.
# The image must contain the Senzing SDK runtime, a JDK and this project's compiled classes;
# build it from Senzing's official runtime base image (see Senzing's published Dockerfile examples).
services:
  customer360:
    image: your-registry/customer360-senzing:latest   # placeholder: build and tag your own image
    env_file: .env
    working_dir: /app
    volumes:
      - ./database:/app/database          # SQLite repository (G2C.db) persists here
      - ./data/senzing-ready:/app/data/senzing-ready:ro
    command: ["sh", "-c", "src/scripts/run-java.sh Orchestrator && src/scripts/run-java.sh ProcessRedo"]
